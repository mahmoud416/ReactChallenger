name: Build and Deploy
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      - run: docker build -t m7/reactproject -f DOCKERFILE.dev .
      - run: docker run -e CI=true m7/reactproject npm run test -- --coverage

      - run: docker build -t m7/multi-client ./client
      - run: docker build -t m7/multi-server ./server
      - run: docker build -t m7/multi-worker ./worker
      - run: docker buld -t m7/multi-nginx ./nginx

      - run: docker push m7/multi-client
      - run: docker push m7/multi-server
      - run: docker push m7/multi-worker
      - run: docker push m7/multi-nginx